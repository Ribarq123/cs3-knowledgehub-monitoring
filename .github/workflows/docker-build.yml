name: Build and Push Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare lowercase image names
        run: |
          echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          echo "IMAGE_REPO=${REPO_NAME,,}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Flask web image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_REPO }}-web:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_REPO }}-web:${{ github.sha }}

      - name: Build and push monitoring collector image
        uses: docker/build-push-action@v6
        with:
          context: ./collector
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_REPO }}-collector:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_REPO }}-collector:${{ github.sha }}
